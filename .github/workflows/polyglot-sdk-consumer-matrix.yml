name: Polyglot SDK consumer matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '13 3 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@df3eed96202810b7e7d6667fabc3041b19e6a22f
    with:
      clients_repository: embedded-alerts/eal-clients
      clients_ref: main
      clients_root: clients
      interfaces_repository: embedded-alerts/eal-interfaces
      interfaces_ref: main
      interfaces_path: eal-interfaces
      interfaces_dependency: embedded-alerts/eal-interfaces
      lib_repository: embedded-alerts/eal-libs
      lib_ref: main
      lib_path: eal-libs
      lib_dependency: embedded-alerts/eal-libs
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
